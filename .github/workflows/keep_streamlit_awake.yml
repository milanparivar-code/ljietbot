name: Keep Streamlit App Awake

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  ping-streamlit-app:
    runs-on: ubuntu-latest

    steps:
      - name: Visit Streamlit app
        run: |
          curl --head \
               --location \
               --max-redirs 5 \
               --user-agent "Mozilla/5.0 (compatible; Streamlit-KeepAlive/1.0)" \
               --connect-timeout 30 \
               --max-time 120 \
               --silent \
               --show-error \
               "https://ljietbotv11.streamlit.app/" || true
